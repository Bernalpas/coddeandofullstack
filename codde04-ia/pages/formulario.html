<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario</title>
</head>
<body>

  <h1>Formulario de Registro</h1>

  <!-- Etiqueta padre del formulario, todos los datos que necesito, deben estar dentro de esta etiqueta -->
  <!-- method="post": especifica el método de envío del formulario -->
  <!-- action="">: especifica la URL a la que se enviarán los datos del formulario -->
  <form action="" method="post">

    <!-- etiqueta para el campo de texto, le muestra al usuario el dato que debe ingresar -->
    <label for="nombre">Nombre:</label>
    <!-- etiqueta para el campo de texto, donde el usuario ingresa el dato -->
    <input type="text" id="nombre" name="nombre" required><!-- obligatorio -->

    <br>

    <label for="email">Correo electrónico:</label>
    <input type="email" id="email" name="email" required><!-- obligatorio -->

    <br>

    <label for="password">Password:</label>
    <input type="password" id="password" name="password" required><!-- obligatorio -->


    <br><!-- salto de linea -->

    <button type="button" onclick="recibirDatos()">Enviar</button>
    <button type="reset">Limpiar</button>

  </form>
  

  <!-- vinculamos el archivo Javascript con este html -->
  <script src="../js/formulario.js"></script>
</body>
</html>
