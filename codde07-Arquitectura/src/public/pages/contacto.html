<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Contacto</title>
    <link rel="stylesheet" href="../css/global.css">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

  <header>
    <nav>
      <ul>
        <li>
          <a href="../index.html">Home</a>
        </li>
        <li>
          <a href="./productos.html">Productos</a>
        </li>
        <li>
          <a href="./contacto.html">Contacto</a>
        </li>
      </ul>
    </nav>
  </header>

    <!-- MAIN -->
    <main class="flex-grow-1 py-5 bg-light">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    <div class="card shadow-sm">
                        <div class="card-body p-4">
                            <h2 class="card-title text-center mb-4">Formulario de Contacto</h2>

                            <form id="contactoForm">
                                <!-- Nombre -->
                                <div class="mb-3">
                                    <label for="nombre" class="form-label">Nombre</label>
                                    <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Tu nombre completo" required>
                                </div>

                                <!-- Email -->
                                <div class="mb-3">
                                    <label for="email" class="form-label">Email</label>
                                    <input type="email" class="form-control" id="email" name="email" placeholder="correo@ejemplo.com" required>
                                </div>

                                <!-- Teléfono -->
                                <div class="mb-3">
                                    <label for="telefono" class="form-label">Teléfono</label>
                                    <input type="tel" class="form-control" id="telefono" name="telefono" placeholder="+54 11 1234-5678">
                                </div>

                                <!-- País -->
                                <div class="mb-3">
                                    <label for="pais" class="form-label">País</label>
                                    <select class="form-select" id="pais" name="pais" required>
                                        <option value="" selected disabled>Selecciona un país</option>
                                        <option value="argentina">Argentina</option>
                                        <option value="chile">Chile</option>
                                        <option value="uruguay">Uruguay</option>
                                        <option value="brasil">Brasil</option>
                                        <option value="mexico">México</option>
                                        <option value="espana">España</option>
                                        <option value="colombia">Colombia</option>
                                        <option value="peru">Perú</option>
                                    </select>
                                </div>

                                <!-- Provincia -->
                                <div class="mb-3">
                                    <label for="provincia" class="form-label">Provincia</label>
                                    <input type="text" class="form-control" id="provincia" name="provincia" placeholder="Tu provincia"
                                    required>
                                </div>

                                <!-- Comentario -->
                                <div class="mb-3">
                                    <label for="comentario" class="form-label">Comentario</label>
                                    <textarea class="form-control" id="comentario" name="comentario" rows="4" placeholder="Escribe tu comentario..." required></textarea>
                                </div>

                                <!-- Botón -->
                                <div class="d-grid">
                                    <button type="submit" class="btn btn-primary btn-lg">Enviar</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-dark text-white text-center py-4 mt-auto">
        <div class="container">
            <p class="mb-1">&copy; 2026 Mi Sitio Web. Todos los derechos reservados.</p>
            <small class="text-muted">Hecho con ❤️ usando Bootstrap</small>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Link a JS para enviar el formulario -->
    <script src="../js/contacto.js"></script>
</body>
</html>
